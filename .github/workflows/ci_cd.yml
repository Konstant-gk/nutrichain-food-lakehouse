name: CI/CD - NutriChain Food Lakehouse Pipeline

env:
  # Opt into Node 24 runtime for JavaScript actions ahead of deprecation.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage report
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            -v

  # Delivery model A: Git syncs via Repos API (PATCH …/repos/{id} with branch) — same as clicking Pull on main.
  # Jobs must use task paths under /Repos/... (not legacy workspace import).
  databricks_delivery:
    name: Sync Databricks Repo (main)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: PATCH Repos to latest remote main
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_REPO_ID: ${{ secrets.DATABRICKS_REPO_ID }}
        run: |
          set -euo pipefail
          for v in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_REPO_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $v"
              echo "Add DATABRICKS_REPO_ID (numeric id from GET /api/2.0/repos or the Repos UI URL)."
              exit 1
            fi
          done
          BASE_URL="${DATABRICKS_HOST%/}"
          echo "Calling Repos update API (PATCH branch main)…"
          code=$(curl -sS -o repo_sync_response.json -w "%{http_code}" -X PATCH \
            "${BASE_URL}/api/2.0/repos/${DATABRICKS_REPO_ID}" \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}')
          echo "HTTP status: ${code}"
          cat repo_sync_response.json
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            exit 1
          fi
          echo "Databricks Repo is updated to latest commit on branch main."
