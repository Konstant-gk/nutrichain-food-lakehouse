name: CI/CD - openFDA Lakehouse Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage report
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            -v

  deploy:
    name: Deploy notebooks to Databricks
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          cat > ~/.databrickscfg << EOF
          [DEFAULT]
          host  = ${DATABRICKS_HOST}
          token = ${DATABRICKS_TOKEN}
          EOF

      - name: Deploy Bronze notebook
        run: |
          databricks workspace import \
            databricks/bronze/bronze_ingestion.py \
            /Shared/openfda/bronze/bronze_ingestion \
            --language PYTHON \
            --overwrite

      - name: Deploy Silver notebook
        run: |
          databricks workspace import \
            databricks/silver/silver_transform.py \
            /Shared/openfda/silver/silver_transform \
            --language PYTHON \
            --overwrite

      - name: Deploy Gold notebook
        run: |
          databricks workspace import \
            databricks/gold/gold_mart.py \
            /Shared/openfda/gold/gold_mart \
            --language PYTHON \
            --overwrite

      - name: Deployment summary
        run: |
          echo "Deployment successful."
          echo "Bronze: /Shared/openfda/bronze/bronze_ingestion"
          echo "Silver: /Shared/openfda/silver/silver_transform"
          echo "Gold:   /Shared/openfda/gold/gold_mart"