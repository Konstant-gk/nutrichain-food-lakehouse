name: CI/CD - NutriChain Food Lakehouse Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage report
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            -v

  deploy:
    name: Deploy notebooks to Databricks
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: |
          cat > ~/.databrickscfg << EOF
          [DEFAULT]
          host  = ${DATABRICKS_HOST}
          token = ${DATABRICKS_TOKEN}
          EOF

      - name: Deploy Bronze job script
        run: |
          databricks workspace import \
            databricks/bronze/bronze_ingestion.py \
            /Shared/nutrichain/bronze/bronze_ingestion \
            --language PYTHON \
            --overwrite

      - name: Deploy Silver job script
        run: |
          databricks workspace import \
            databricks/silver/silver_transform.py \
            /Shared/nutrichain/silver/silver_transform \
            --language PYTHON \
            --overwrite

      - name: Deploy Gold job script
        run: |
          databricks workspace import \
            databricks/gold/gold_mart.py \
            /Shared/nutrichain/gold/gold_mart \
            --language PYTHON \
            --overwrite

      - name: Deployment summary
        run: |
          echo "✓ Deployment successful."
          echo "Bronze : /Shared/nutrichain/bronze/bronze_ingestion"
          echo "Silver : /Shared/nutrichain/silver/silver_transform"
          echo "Gold   : /Shared/nutrichain/gold/gold_mart"