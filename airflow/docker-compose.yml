# docker-compose.yml
# ------------------
# Starts a complete local Airflow environment: database + scheduler + web UI.

# How to start:  cd airflow && docker-compose up -d
# How to stop:   docker-compose down
# View logs:     docker-compose logs -f airflow-scheduler
# Access UI:     http://localhost:8080  
name: nutrichain-lakehouse
services:
  
  # ── PostgreSQL database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:       # Persist the database data outside the container.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:  # Docker waits for Postgres to be ready before starting Airflow.
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── One-time database initialisation ──────────────────────────────────────
  airflow-init:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy  # Wait for Postgres to be ready first.
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false" # Don't show the tutorial DAGs.
      PYTHONPATH: /opt/airflow/src
    command:
      - bash
      - -c
      - airflow db init && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL}

  
  # ── Scheduler ─────────────────────────────────────────────────────────────
  airflow-scheduler:
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABRICKS_HOST:    ${DATABRICKS_HOST}
      DATABRICKS_TOKEN:   ${DATABRICKS_TOKEN}
      OPENFOOD_MAX_PAGES: ${OPENFOOD_MAX_PAGES}
      PYTHONPATH: /opt/airflow/src
    volumes:
      - ./dags:/opt/airflow/dags      # Mount dags/ folder INTO the container.
      - ./logs:/opt/airflow/logs      # Mount logs/ folder INTO the container.
      - ../src:/opt/airflow/src        # Mount src/ folder INTO the container.
    command: airflow scheduler


  # ── Web Server ───────────────────────────────────────────────────────────────
  airflow-webserver:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABRICKS_HOST:    ${DATABRICKS_HOST}
      DATABRICKS_TOKEN:   ${DATABRICKS_TOKEN}
      OPENFOOD_MAX_PAGES: ${OPENFOOD_MAX_PAGES}
      PYTHONPATH: /opt/airflow/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ../src:/opt/airflow/src
    command: airflow webserver 

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:                # For persistence.